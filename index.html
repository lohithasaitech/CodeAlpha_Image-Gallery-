<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>My Image Gallery</h1>
        <p>Created by Lohitha Sai</p>
    </header>

    <div class="filters">
        <button class="active" onclick="filterImages('all', event)">All</button>
        <button onclick="filterImages('nature', event)">Nature</button>
        <button onclick="filterImages('cars', event)">Cars</button>
    </div>

    <div class="gallery">

        <div class="photo nature">
            <img src="https://picsum.photos/id/28/800/500"
                 alt="Nature Image"
                 onclick="openImage(this)">
        </div>

        <div class="photo cars">
            <img src="https://picsum.photos/id/1071/800/500"
                 alt="Car Image"
                 onclick="openImage(this)">
        </div>

        <div class="photo nature">
            <img src="https://picsum.photos/id/29/800/500"
                 alt="Nature Image"
                 onclick="openImage(this)">
        </div>

        <div class="photo cars">
            <img src="https://picsum.photos/id/133/800/500"
                 alt="Car Image"
                 onclick="openImage(this)">
        </div>

        <div class="photo nature">
            <img src="https://picsum.photos/id/10/800/500"
                 alt="Nature Image"
                 onclick="openImage(this)">
        </div>

        <div class="photo cars">
            <img src="https://picsum.photos/id/111/800/500"
                 alt="Car Image"
                 onclick="openImage(this)">
        </div>

    </div>

    <div id="lightbox" class="lightbox">

        <span class="close" onclick="closeImage()">&times;</span>

        <button class="btn-prev" onclick="changeImage(-1)">
            &#10094;
        </button>

        <img id="popup-img" src="" alt="Preview">

        <button class="btn-next" onclick="changeImage(1)">
            &#10095;
        </button>

    </div>

    <footer>
        <p>Created by Lohitha Sai</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
